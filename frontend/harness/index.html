<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>piyolog-card harness</title>
<style>
  /* Minimal stand-ins for Home Assistant's theme variables and elements. */
  :root {
    --primary-text-color: #212121; --secondary-text-color: #727272;
    --divider-color: #e0e0e0; --secondary-background-color: #f1f3f4;
    --card-background-color: #ffffff; --primary-color: #03a9f4;
    --ha-card-background: #ffffff;
  }
  :root[data-theme="dark"] {
    --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b;
    --divider-color: #2f3640; --secondary-background-color: #2a313a;
    --card-background-color: #1c1c1c; --primary-color: #03a9f4;
    --ha-card-background: #1c1c1c; color-scheme: dark;
  }
  body { margin: 0; padding: 24px; font-family: Roboto, system-ui, sans-serif;
    background: var(--card-background-color); color: var(--primary-text-color); }
  body { background: #fafafa; }
  :root[data-theme="dark"] body { background: #111111; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px;
    max-width: 1100px; margin: 0 auto; align-items: start; }
  .col { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); min-width: 0; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script>
  // Stand-ins for Home Assistant's own elements (they live in shadow roots, so page CSS cannot reach them).
  customElements.define("ha-card", class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: "open" }).innerHTML =
        '<style>:host{display:block;background:var(--ha-card-background);border-radius:12px;' +
        'box-shadow:0 1px 3px rgba(0,0,0,.15)}</style><slot></slot>';
    }
  });
  // Stand-in for <ha-icon>. It draws the real Material Design Icons glyphs when the font can be loaded
  // (needs network, used for the README screenshots) and a plain square otherwise.
  const MDI = { "mdi:baby-bottle-outline": "\u{F0F3A}", "mdi:sleep": "\u{F04B2}" };
  const mdiFace = document.createElement("style");
  mdiFace.textContent = '@font-face{font-family:"mdi-harness";src:url("https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.woff2") format("woff2")}';
  document.head.append(mdiFace);
  customElements.define("ha-icon", class extends HTMLElement {
    static get observedAttributes() { return ["icon"]; }
    constructor() {
      super();
      this.attachShadow({ mode: "open" });
      this.draw();
    }
    attributeChangedCallback() { this.draw(); }
    draw() {
      const glyph = MDI[this.getAttribute("icon")];
      this.shadowRoot.innerHTML = '<style>:host{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center}' +
        'span{font:24px/1 "mdi-harness"}</style>' +
        (glyph ? "<span>" + glyph + "</span>" : '<span style="font:14px/1 sans-serif">&#9632;</span>');
    }
  });
</script>
<script src="mock.js"></script>
<script type="module" src="/custom_components/piyolog/frontend/piyolog-card.js"></script>
<script type="module">
  const params = new URLSearchParams(location.search);
  if (params.get("theme") === "dark") document.documentElement.dataset.theme = "dark";
  const hass = window.__mockHass(params.get("lang") || "ja", params.get("empty") === "1");
  const grid = document.getElementById("grid");
  const mk = (tag, config) => {
    const el = document.createElement(tag);
    el.setConfig({ type: `custom:${tag}`, ...config });
    el.hass = hass;
    return el;
  };
  if (params.get("card")) {
    // One card on its own, used for the README screenshots: summary, list, timeline, compact-formula, compact-sleep.
    const which = params.get("card");
    grid.style.cssText = "display:block;margin:0";
    // Transparent ground, so the screenshot works on light and dark pages alike.
    document.documentElement.style.background = "transparent";
    document.body.style.background = "transparent";
    const wrap = document.createElement("div");
    const config = { device_id: "dev1" };
    let tag = "piyolog-" + which + "-card";
    if (which === "list") {
      wrap.style.cssText = "width:235px;height:184px";
    } else {
      wrap.style.cssText = "width:420px";
    }
    if (which.startsWith("compact-")) {
      tag = "piyolog-compact-card";
      config.kind = which.slice("compact-".length);
    }
    const el = mk(tag, config);
    if (which === "list") el.style.height = "100%";
    wrap.append(el);
    grid.append(wrap);
  } else if (params.get("list") === "1") {
    // Mimics a sections row: 3 columns wide (235px), 3 rows high (184px).
    document.body.style.cssText = "margin:0;padding:16px;background:var(--bg)";
    grid.style.cssText = "display:flex;gap:8px;align-items:stretch;flex-wrap:wrap";
    for (const config of [{}, { items: ["breastfeeding", "pee", "poop", "sleep", "today_formula"] }]) {
      const cell = document.createElement("div");
      cell.style.cssText = "width:235px;" + (Object.keys(config).length ? "min-height:240px" : "height:184px");
      const el = mk("piyolog-list-card", { device_id: "dev1", ...config });
      el.style.height = "100%";
      cell.append(el);
      grid.append(cell);
    }
  } else if (params.get("custom") === "1") {
    const a = document.createElement("div"); a.className = "col";
    const b = document.createElement("div"); b.className = "col";
    a.append(
      mk("piyolog-summary-card", { device_id: "dev1", tiles: ["poop", "pee", "formula"], totals: ["formula", "sleep"] }),
      mk("piyolog-summary-card", { device_id: "dev1", tiles: [], totals: ["diapers", "breastfeeding", "formula"] }),
    );
    b.append(
      mk("piyolog-timeline-card", { device_id: "dev1", rows: ["diaper", "sleep"], legend: false }),
      mk("piyolog-timeline-card", { device_id: "dev1", rows: [], log: true }),
      mk("piyolog-compact-card", { device_id: "dev1", kind: "formula", quick: ["poop_since", "diapers"] }),
      mk("piyolog-compact-card", { device_id: "dev1", kind: "formula", quick: [] }),
    );
    grid.append(a, b);
  } else {
  const left = document.createElement("div"); left.className = "col";
  const right = document.createElement("div"); right.className = "col";
  left.append(mk("piyolog-summary-card", { device_id: "dev1" }));
  right.append(
    mk("piyolog-timeline-card", { device_id: "dev1" }),
    mk("piyolog-compact-card", { device_id: "dev1", kind: "formula" }),
    mk("piyolog-compact-card", { device_id: "dev1", kind: "sleep" }),
  );
  grid.append(left, right);
  }
</script>
</body>
</html>
